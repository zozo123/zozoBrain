name: Verify decision policy and reproduce baseline
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.11', '3.12', '3.13']
    env:
      OPENBLAS_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '${{ matrix.python }}'
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          enable-cache: true
      - run: uv sync --locked
      - run: uv run --locked weights.py --check
      - run: uv run --locked python -m unittest -v
      - run: uv run --locked evaluate.py --check
      - run: uv run --locked python -m unittest -v
        working-directory: baselines/gradient
